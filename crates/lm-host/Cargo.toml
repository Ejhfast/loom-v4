[package]
name = "lm-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
getrandom = "0.2"
lm-abi = { path = "../lm-abi" }
lm-bytecode = { path = "../lm-bytecode" }
lm-compiler = { path = "../lm-compiler" }
lm-source = { path = "../lm-source" }
lm-verify = { path = "../lm-verify" }
lm-vm = { path = "../lm-vm" }
mio = { version = "1.0", features = ["net", "os-poll"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
socket2 = "0.6"
webpki-roots = "=1.0.3"

[dev-dependencies]
lm-proc = { path = "../lm-proc" }
lm-testkit = { path = "../lm-testkit" }
rcgen = "=0.14.5"
