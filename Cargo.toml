[workspace]
resolver = "2"
members = [
    "crates/lm-abi",
    "crates/lm-scc",
    "crates/lm-source",
    "crates/lm-types",
    "crates/lm-hir",
    "crates/lm-bytecode",
    "crates/lm-verify",
    "crates/lm-math",
    "crates/lm-regex",
    "crates/lm-jit",
    "crates/lm-link",
    "crates/lm-value",
    "crates/lm-heap",
    "crates/lm-graph",
    "crates/lm-vm",
    "crates/lm-proc",
    "crates/lm-compiler",
    "crates/lm-cli",
    "crates/lm-host",
    "crates/lm-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Keep Loom debug code debuggable. Optimize the native backend used by tests.
[profile.dev.package]
cranelift-assembler-x64 = { opt-level = 3 }
cranelift-bforest = { opt-level = 3 }
cranelift-bitset = { opt-level = 3 }
cranelift-codegen = { opt-level = 3 }
cranelift-codegen-shared = { opt-level = 3 }
cranelift-control = { opt-level = 3 }
cranelift-entity = { opt-level = 3 }
cranelift-frontend = { opt-level = 3 }
cranelift-isle = { opt-level = 3 }
cranelift-jit = { opt-level = 3 }
cranelift-module = { opt-level = 3 }
cranelift-native = { opt-level = 3 }
regalloc2 = { opt-level = 3 }
